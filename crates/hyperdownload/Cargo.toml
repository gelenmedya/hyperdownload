[package]
name = "hyperdownload"
description = "HyperDownload, the download manager add-on of rustyfiles"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
hd-engine.workspace = true
hd-torrent.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow = "1"
axum = "0.8"
base64 = "0.23"
bytes = "1"
getrandom = "0.3"
tokio = { version = "1", features = ["full"] }

[build-dependencies]
embed-resource = "3"
