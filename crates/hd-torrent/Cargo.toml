[package]
name = "hd-torrent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "HyperDownload's torrent engine (from torwatch): librqbit, streaming while downloading, subtitles, audio"

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
base64 = "0.23"
bytes = "1.12.1"
encoding_rs = { version = "0.8.44", default-features = false }
filmcraft-ac3 = "0.9"
filmcraft-isobmff = "0.9"
filmcraft-matroska = "0.9"
fs4 = { version = "0.13", features = ["sync"] }
futures = "0.3.34"
librqbit-core = { version = "9.1.0", default-features = false }
librqbit = { version = "9.1.0", default-features = false, features = ["rust-tls"] }
oxideav-dts = { version = "0.0.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "io-util"] }
tracing = "0.1.44"
flacenc = { version = "0.5", default-features = false }
truehd = "0.7"

[dev-dependencies]
claxon = "0.4"
tempfile = "3"
rand = "0.9"
