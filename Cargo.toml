[workspace]
resolver = "3"
members = ["crates/hd-engine", "crates/hyperdownload"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
hd-engine = { path = "crates/hd-engine" }
# no gzip: a download is asked for in byte ranges, and a compressed answer would break them
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
